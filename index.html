<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weird Thoughts Hotline ☎️✨</title>
    
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #12121a;
            --panel-bg: #1a1a2e;
            --card-bg: #16213e;
            --accent: #ff7b9c;
            --accent-hover: #ff5277;
            --text-main: #e0e0e0;
            --text-muted: #8a8ab0;
            --border: #0f3460;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--border);
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent);
            text-shadow: 0 0 12px rgba(255, 123, 156, 0.5);
            text-align: center;
            margin-top: 0;
            font-size: 24px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            background: var(--card-bg);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            font-size: 15px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .username {
            color: var(--accent);
            font-weight: bold;
        }

        .timestamp {
            color: var(--text-muted);
            font-size: 11px;
        }

        .post-content {
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .feed-title {
            color: var(--accent);
            font-size: 16px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Submission Box -->
    <div class="container">
        <h1>📞 Weird Thoughts Hotline 🌙</h1>
        <p class="subtitle">The line is open... broadcast your weirdest thoughts to everyone on Earth.</p>
        
        <input type="text" id="authorInput" placeholder="Your Name / Codename (e.g. K-☆)" maxlength="30">
        <textarea id="thoughtInput" placeholder="Type your random thought here... (e.g., Do fish know they're wet?)" maxlength="300"></textarea>
        
        <button onclick="createPost()">Transmit Thought 🌌</button>
    </div>

    <!-- Public Live Feed -->
    <div class="container">
        <div class="feed-title">📡 Global Live Feed</div>
        <div id="feedContainer">
            <div class="status-msg">Connecting to the void...</div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // FIREBASE CONFIGURATION (REPLACE THE TEXT BELOW WITH YOUR OWN)
        // ----------------------------------------------------
        const firebaseConfig = {
            apiKey: "PASTE_YOUR_FIREBASE_API_KEY_HERE",
            authDomain: "PASTE_YOUR_FIREBASE_AUTH_DOMAIN_HERE",
            projectId: "PASTE_YOUR_FIREBASE_PROJECT_ID_HERE",
            storageBucket: "PASTE_YOUR_FIREBASE_STORAGE_BUCKET_HERE",
            messagingSenderId: "PASTE_YOUR_FIREBASE_MESSAGING_SENDER_ID_HERE",
            appId: "PASTE_YOUR_FIREBASE_APP_ID_HERE"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Real-time listener: pulls thoughts from the cloud database instantly for everyone
        db.collection("thoughts")
          .orderBy("createdAt", "desc")
          .onSnapshot((snapshot) => {
              const feedContainer = document.getElementById('feedContainer');
              feedContainer.innerHTML = '';

              if (snapshot.empty) {
                  feedContainer.innerHTML = `<div class="status-msg">No weird thoughts transmitted yet. Be the first!</div>`;
                  return;
              }

              snapshot.forEach((doc) => {
                  const data = doc.data();
                  
                  const postEl = document.createElement('div');
                  postEl.className = 'post-card';
                  
                  let timeString = 'Just now';
                  if (data.createdAt) {
                      timeString = new Date(data.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                  }

                  postEl.innerHTML = `
                      <div class="post-header">
                          <span class="username">${escapeHtml(data.author)}</span>
                          <span class="timestamp">${timeString}</span>
                      </div>
                      <div class="post-content">${escapeHtml(data.content)}</div>
                  `;
                  
                  feedContainer.appendChild(postEl);
              });
          }, (error) => {
              console.error("Error loading thoughts:", error);
              document.getElementById('feedContainer').innerHTML = `<div class="status-msg" style="color: #ff5277;">Error connecting to database. Make sure you replaced the Firebase configuration keys!</div>`;
          });

        // Function to handle submitting a thought with validation
        async function createPost() {
            const authorField = document.getElementById('authorInput');
            const thoughtField = document.getElementById('thoughtInput');

            const author = authorField.value.trim() || 'Anonymous';
            const content = thoughtField.value.trim();

            if (!content) {
                alert('Please type a thought before transmitting!');
                return;
            }

            if (content.length > 300) {
                alert('Your thought is too long! Keep it under 300 characters.');
                return;
            }

            try {
                await db.collection("thoughts").add({
                    author: author,
                    content: content,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                thoughtField.value = '';
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Failed to send thought. Make sure your Firebase keys are correctly entered!");
            }
        }

        // Security helper to prevent HTML script injection
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;")
                       .replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;")
                       .replace(/"/g, "&quot;")
                       .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
