<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weird Thoughts Hotline ☎️✨</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #12121a;
            --panel-bg: #1a1a2e;
            --card-bg: #16213e;
            --accent: #ff7b9c;
            --accent-hover: #ff5277;
            --text-main: #e0e0e0;
            --text-muted: #8a8ab0;
            --border: #0f3460;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid var(--border);
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent);
            text-shadow: 0 0 12px rgba(255, 123, 156, 0.5);
            text-align: center;
            margin-top: 0;
            font-size: 24px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            background: var(--card-bg);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 12px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, transform 0.1s;
            font-size: 14px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .main-btn {
            width: 100%;
            padding: 12px;
            font-size: 15px;
        }

        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .username {
            color: var(--accent);
            font-weight: bold;
        }

        .follow-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 5px;
        }

        .follow-btn.following {
            background: var(--accent);
            color: var(--bg-color);
        }

        .timestamp {
            color: var(--text-muted);
            font-size: 11px;
        }

        .post-content {
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;
            margin-bottom: 12px;
        }

        .post-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }

        .action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .comments-section {
            font-size: 13px;
        }

        .comment-item {
            background: rgba(0,0,0,0.2);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .comment-author {
            color: var(--accent);
            font-weight: bold;
            font-size: 11px;
            margin-right: 5px;
        }

        .comment-input-box {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .comment-input-box input {
            margin-bottom: 0;
            padding: 8px;
            font-size: 12px;
        }

        .comment-input-box button {
            padding: 0 15px;
            font-size: 12px;
        }

        .feed-title {
            color: var(--accent);
            font-size: 16px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Kutia e dërgimit -->
    <div class="container">
        <h1>📞 Weird Thoughts Hotline 🌙</h1>
        <p class="subtitle">Shkruaj, pëlqe, ndiq dhe komento në kohë reale me gjithë botën!</p>
        
        <input type="text" id="authorInput" placeholder="Emri ose Pseudonimi yt (p.sh. K-☆)" maxlength="30">
        <textarea id="thoughtInput" placeholder="Shkruaj një mendim të çuditshëm këtu..." maxlength="300"></textarea>
        
        <button class="main-btn" onclick="createPost()">Transmeto Mendimin 🌌</button>
    </div>

    <!-- Feed-i Publik -->
    <div class="container">
        <div class="feed-title">📡 Sfondi Global & Ndërveprimet</div>
        <div id="feedContainer">
            <div class="status-msg">Po lidhemi me bazën e të dhënave...</div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // VENDOS KËTU ÇELËSAT E FIREBASE
        // ----------------------------------------------------
        const firebaseConfig = {
            apiKey: "PASTE_YOUR_FIREBASE_API_KEY_HERE",
            authDomain: "PASTE_YOUR_FIREBASE_AUTH_DOMAIN_HERE",
            projectId: "PASTE_YOUR_FIREBASE_PROJECT_ID_HERE",
            storageBucket: "PASTE_YOUR_FIREBASE_STORAGE_BUCKET_HERE",
            messagingSenderId: "PASTE_YOUR_FIREBASE_MESSAGING_SENDER_ID_HERE",
            appId: "PASTE_YOUR_FIREBASE_APP_ID_HERE"
        };

        // Inicializimi i Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Ruajmë në shfletues vetëm se kë ka ndjekur ky përdorues në këtë pajisje
        let followingList = JSON.parse(localStorage.getItem('wh_following') || '[]');

        // Dëgjuesi në kohë reale për postimet
        db.collection("thoughts")
          .orderBy("createdAt", "desc")
          .onSnapshot((snapshot) => {
              const feedContainer = document.getElementById('feedContainer');
              feedContainer.innerHTML = '';

              if (snapshot.empty) {
                  feedContainer.innerHTML = `<div class="status-msg">Ende nuk ka asnjë mendim. Bëhu i pari që shkruan!</div>`;
                  return;
              }

              snapshot.forEach((doc) => {
                  const data = doc.data();
                  const postId = doc.id;
                  const author = data.author || 'Anonim';
                  
                  const postEl = document.createElement('div');
                  postEl.className = 'post-card';
                  
                  let timeString = 'Sapo tani';
                  if (data.createdAt) {
                      timeString = new Date(data.createdAt.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                  }

                  const likesCount = data.likes || 0;
                  const isFollowing = followingList.includes(author);

                  postEl.innerHTML = `
                      <div class="post-header">
                          <div class="user-info">
                              <span class="username">${escapeHtml(author)}</span>
                              <button class="follow-btn ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${escapeHtml(author)}')">
                                  ${isFollowing ? 'Following ✓' : 'Follow +'}
                              </button>
                          </div>
                          <span class="timestamp">${timeString}</span>
                      </div>
                      <div class="post-content">${escapeHtml(data.content)}</div>
                      
                      <div class="post-actions">
                          <button class="action-btn" onclick="likePost('${postId}', ${likesCount})">
                              ❤️ Like (${likesCount})
                          </button>
                      </div>

                      <div class="comments-section">
                          <div id="comments-${postId}"></div>
                          <div class="comment-input-box">
                              <input type="text" id="comment-input-${postId}" placeholder="Shkruaj një koment..." maxlength="150">
                              <button onclick="addComment('${postId}')">Koment</button>
                          </div>
                      </div>
                  `;
                  
                  feedContainer.appendChild(postEl);
                  loadComments(postId);
              });
          }, (error) => {
              console.error("Gabim në ngarkim:", error);
              document.getElementById('feedContainer').innerHTML = `<div class="status-msg" style="color: #ff5277;">Gabim në lidhje me databazën. Kontrollo çelësat e Firebase!</div>`;
          });

        // Dërgimi i një mendimi të ri
        async function createPost() {
            const authorField = document.getElementById('authorInput');
            const thoughtField = document.getElementById('thoughtInput');

            const author = authorField.value.trim() || 'Anonim';
            const content = thoughtField.value.trim();

            if (!content) {
                alert('Të lutem shkruaj një mendim para se ta transmetosh!');
                return;
            }

            if (content.length > 300) {
                alert('Mendimi yt është shumë i gjatë! Mbaje nën 300 karaktere.');
                return;
            }

            try {
                await db.collection("thoughts").add({
                    author: author,
                    content: content,
                    likes: 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                thoughtField.value = '';
            } catch (error) {
                console.error("Gabim në dërgim: ", error);
                alert("Dërgimi dështoi. Sigurohu që ke vendosur saktë çelësat e Firebase!");
            }
        }

        // Funksioni për Like
        async function likePost(postId, currentLikes) {
            try {
                await db.collection("thoughts").doc(postId).update({
                    likes: currentLikes + 1
                });
            } catch (error) {
                console.error("Gabim te like:", error);
            }
        }

        // Funksioni për Follow / Unfollow
        function toggleFollow(authorName) {
            if (followingList.includes(authorName)) {
                followingList = followingList.filter(name => name !== authorName);
            } else {
                followingList.push(authorName);
            }
            localStorage.setItem('wh_following', JSON.stringify(followingList));
            // Rifreskon pamjen direkt duke ridrejtuar snapshot-in
            location.reload(); 
        }

        // Shto koment në kohë reale
        async function addComment(postId) {
            const inputField = document.getElementById(`comment-input-${postId}`);
            const authorField = document.getElementById('authorInput');
            const commentText = inputField.value.trim();
            const commentAuthor = authorField.value.trim() || 'Anonim';

            if (!commentText) return;

            try {
                await db.collection("thoughts").doc(postId).collection("comments").add({
                    author: commentAuthor,
                    text: commentText,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                inputField.value = '';
            } catch (error) {
                console.error("Gabim në koment:", error);
            }
        }

        // Ngarko komentet për çdo postim në kohë reale
        function loadComments(postId) {
            const commentsContainer = document.getElementById(`comments-${postId}`);
            
            db.collection("thoughts").doc(postId).collection("comments")
              .orderBy("createdAt", "asc")
              .onSnapshot((snapshot) => {
                  commentsContainer.innerHTML = '';
                  snapshot.forEach((doc) => {
                      const comment = doc.data();
                      const commentEl = document.createElement('div');
                      commentEl.className = 'comment-item';
                      commentEl.innerHTML = `
                          <span class="comment-author">${escapeHtml(comment.author)}:</span>
                          <span>${escapeHtml(comment.text)}</span>
                      `;
                      commentsContainer.appendChild(commentEl);
                  });
              });
        }

        // Funksion sigurie për të parandaluar keqpërdorimet HTML
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;")
                       .replace(/</g, "&lt;")
                       .replace(/>/g, "&gt;")
                       .replace(/"/g, "&quot;")
                       .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
