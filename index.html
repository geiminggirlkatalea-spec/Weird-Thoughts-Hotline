<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weird Thoughts Hotline ☎️✨</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #ff7b9c;
            text-shadow: 0 0 10px rgba(255, 123, 156, 0.5);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #0f3460;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        textarea {
            width: 80%;
            height: 100px;
            background: #0f3460;
            color: #fff;
            border: 1px solid #ff7b9c;
            border-radius: 8px;
            padding: 10px;
            font-family: inherit;
            resize: none;
        }
        button {
            background-color: #ff7b9c;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #ff5277;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📞 Weird Thoughts Hotline 🌙</h1>
        <p>Line is open... what's on your mind today?</p>
        
        <br>
        <textarea placeholder="Type your random thoughts here..."></textarea>
        <br>
        <button onclick="alert('Thought transmitted to the void! 🌌')">Submit Thought</button>
    </div>

</body>
</html>
